<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klo Kompass</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--tx:#0f1f26;--mu:#5b6b73;--bd:#d9e2e6;--ac:#0e7490;--st:#f59e0b;--ok:#dcfce7;--okt:#166534;--pay:#fef3c7;--payt:#92400e;--acs:#e0f2f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0f1a1f;--card:#18262d;--tx:#e8f1f4;--mu:#9bb0b8;--bd:#2b3f48;--acs:#12343f;--ok:#12372a;--okt:#86efac;--pay:#3b2e0f;--payt:#fcd34d}
[data-theme=herbst]{--bg:#f8efe4;--card:#fffaf3;--tx:#3b2414;--mu:#7a5c47;--bd:#e6d3bd;--ac:#b45309;--acs:#fde8cc}
[data-theme=sommer]{--bg:#fffbe6;--card:#fffef5;--tx:#2d2a05;--mu:#6b6627;--bd:#efe6a3;--ac:#0e7490;--acs:#fdf3b0}
[data-theme=winter]{--bg:#eef4fb;--card:#fafcff;--tx:#14263d;--mu:#56708f;--bd:#cfdcec;--ac:#2563a8;--acs:#dce9f8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.tap{cursor:pointer}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.st{color:var(--st);letter-spacing:1px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pay);color:var(--payt)}
.badge.free{background:var(--ok);color:var(--okt)}.badge.ac{background:var(--acs);color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 13px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-weight:600;font-size:14px}
button.pri{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px;width:100%;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:var(--acs);color:var(--ac);border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 2px;font:inherit;font-size:11px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:26px;font-weight:700;color:var(--ac)}
.picker span{font-size:34px;cursor:pointer;color:var(--bd)}.picker span.on{color:var(--st)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme{border:2px solid var(--bd);border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;background:var(--card)}.theme.on{border-color:var(--ac)}
.theme b{display:block;font-size:24px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.sw input{width:20px;height:20px;margin:0}
.mapbox{position:relative;width:100%;aspect-ratio:4/3;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.mapbox iframe{width:100%;height:100%;border:0}.ov{position:absolute;inset:0;cursor:crosshair}
.pin{position:absolute;width:14px;height:14px;background:#dc2626;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.tg{display:flex;align-items:center;gap:8px;padding:6px 0}.tg input{width:20px;height:20px;margin:0}
.rad{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f1f26;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.s{opacity:1}.back{background:none;border:0;color:var(--ac);font:inherit;font-weight:600;padding:0 0 8px;cursor:pointer}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SEED=[
{id:1,name:'Stadttoilette Marienplatz',address:'Marienplatz 1',city:'München',lat:48.1374,lng:11.5755,price:'Kostenlos',wheelchair:true,hours:'06:00–22:00',rating:3.8,review_count:12},
{id:2,name:'WC Hauptbahnhof Berlin',address:'Europaplatz 1',city:'Berlin',lat:52.5251,lng:13.3694,price:'€1,00',wheelchair:true,hours:'00:00–24:00',rating:4.2,review_count:25},
{id:3,name:'Toilette Alsterpark',address:'Alsterufer 12',city:'Hamburg',lat:53.5653,lng:9.9993,price:'€0,50',wheelchair:false,hours:'08:00–20:00',rating:3.1,review_count:8},
{id:4,name:'City WC Domplatte',address:'Domkloster 4',city:'Köln',lat:50.9413,lng:6.9583,price:'€0,50',wheelchair:true,hours:'07:00–23:00',rating:3.9,review_count:17},
{id:5,name:'Öffentliches WC Römerberg',address:'Römerberg 7',city:'Frankfurt',lat:50.1106,lng:8.6821,price:'Kostenlos',wheelchair:false,hours:'06:00–22:00',rating:3.4,review_count:6}];
const SREV=[
{id:1,toilet_id:1,toilet_name:SEED[0].name,reviewer_name:'Lena',rating:4,comment:'Sauber und gut erreichbar.',created_at:'2026-09-12'},
{id:2,toilet_id:2,toilet_name:SEED[1].name,reviewer_name:'Tom',rating:5,comment:'Top gepflegt, Preis okay.',created_at:'2026-09-20'},
{id:3,toilet_id:3,toilet_name:SEED[2].name,reviewer_name:'Aylin',rating:3,comment:'Etwas in die Jahre gekommen.',created_at:'2026-09-28'},
{id:4,toilet_id:4,toilet_name:SEED[3].name,reviewer_name:'Jonas',rating:4,comment:'Direkt am Dom, sehr praktisch.',created_at:'2026-10-02'}];
SEED.forEach(t=>{t.baby=[1,2,4].includes(t.id);t.card=[2,4].includes(t.id)});
let T=ls.get('kf_t',SEED),R=ls.get('kf_r',SREV);
let S=Object.assign({theme:'hell',onlyAcc:false,preferFree:false,onlyOpen:false,navApp:'google',radius:'5000',alerts:false,fs:'normal'},ls.get('kf_s',{}));
let page='near',detail=null,q='',f={best:false,free:false,acc:false,now:false,baby:false,card:false,near:false,rad:false},me=null,mapF='Alle',cm='manuell',pick=null,stars=0,rstars=0;
const save=()=>{ls.set('kf_t',T);ls.set('kf_r',R);ls.set('kf_s',S)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',2200)};
const fmt=n=>n.toFixed(1).replace('.',',');
const starsH=n=>{const r=Math.round(n);return '★'.repeat(r)+'☆'.repeat(5-r)};
const isOpen=h=>{const m=/(\d\d):(\d\d)–(\d\d):(\d\d)/.exec(h);if(!m)return true;const d=new Date(),x=d.getHours()*60+d.getMinutes();return x>=+m[1]*60+ +m[2]&&x<+m[3]*60+ +m[4]};
const badge=p=>`<span class="badge ${p==='Kostenlos'?'free':''}">${esc(p)}</span>`;
const free=t=>t.price==='Kostenlos';
const dist=t=>me?Math.round(2*6371000*Math.asin(Math.sqrt(Math.sin((t.lat-me.lat)*Math.PI/360)**2+Math.cos(me.lat*Math.PI/180)*Math.cos(t.lat*Math.PI/180)*Math.sin((t.lng-me.lng)*Math.PI/360)**2))):null;
const dTxt=t=>{const d=dist(t);return d==null?'':d<1000?d+' m':(d/1000).toFixed(1).replace('.',',')+' km'};
function locate(cb){if(!navigator.geolocation)return toast('GPS wird nicht unterstützt.');toast('Standort wird ermittelt …');navigator.geolocation.getCurrentPosition(p=>{me={lat:p.coords.latitude,lng:p.coords.longitude};toast('Standort gefunden ✓');cb?cb():render()},()=>{f.near=f.rad=false;toast('Standort nicht verfügbar. Bitte Berechtigung prüfen.')},{timeout:10000})}
const emptyH=()=>me&&f.rad&&!q?`<div class="card"><b>Keine WCs in deiner Nähe</b><p class="mu">Im Umkreis von ${S.radius>=1000?S.radius/1000+' km':S.radius+' m'} gibt es noch keinen Eintrag. Die App enthält bisher nur Demo-Daten (München, Berlin, Hamburg, Köln, Frankfurt). Such eine Stadt oder füge das nächste WC selbst hinzu.</p></div>`:'<p class="mu">Keine WCs gefunden. Passe Suche oder Filter an.</p>';
function rush(){const run=()=>{const c=T.filter(t=>isOpen(t.hours)&&!(t.status&&t.status.s==='defekt')).sort((a,b)=>dist(a)-dist(b));if(!c.length)return toast('Kein geöffnetes WC gefunden.');toast('Nächstes WC: '+c[0].name+' ('+dTxt(c[0])+')');go('detail',c[0].id)};me?run():locate(run)}
function stat(id,s){const t=T.find(x=>x.id===id);t.status={s,at:new Date().toISOString().slice(0,10)};save();toast('Danke für die Meldung ✓');render()}
function rep(id){const t=T.find(x=>x.id===id);t.reports=(t.reports||0)+1;save();toast('Danke, wir prüfen den Eintrag. 🚩')}
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme==='hell'?'':S.theme);document.body.style.fontSize=S.fs==='groß'?'18px':S.fs==='sehr groß'?'21px':'15px'}
const NAV=[['near','📍','In der Nähe'],['map','🗺️','Karte'],['add','➕','Hinzufügen'],['rev','⭐','Bewertungen'],['set','⚙️','Einstellungen']];
function go(p,id){page=p;detail=id||null;stars=0;render();scrollTo(0,0)}
function card(t){return `<div class="card tap" onclick="go('detail',${t.id})"><div class="row sp"><b>${esc(t.name)}</b>${badge(t.price)}</div>
<div class="mu">${esc(t.address)}, ${esc(t.city)}</div>
<div class="row sp" style="margin-top:6px"><span><span class="st">${starsH(t.rating)}</span> <b>${fmt(t.rating)}</b> <span class="mu">(${t.review_count})</span></span>
<span>${t.wheelchair?'<span class="badge ac">♿ Rollstuhlgerecht</span> ':''}${t.baby?'🍼 ':''}${t.card?'💳':''}</span></div>
<div class="mu" style="margin-top:4px">${me?'📏 '+dTxt(t)+' · ':''}${t.status?(t.status.s==='defekt'?'⚠️ Defekt':'✅ Sauber')+' · ':''}🕒 ${esc(t.hours)} ${isOpen(t.hours)?'· <b style="color:var(--okt)">Geöffnet</b>':'· Geschlossen'}</div></div>`}
function list(){let l=T.filter(t=>(!q||(t.city+t.name+t.address).toLowerCase().includes(q.toLowerCase()))&&(!f.free||free(t))&&(!f.acc||t.wheelchair)&&(!S.onlyAcc||t.wheelchair)&&(!S.onlyOpen||isOpen(t.hours))&&(!f.now||isOpen(t.hours))&&(!f.baby||t.baby)&&(!f.card||t.card)&&(!f.rad||!me||q||dist(t)<=+S.radius));
if(f.near&&me)l.sort((a,b)=>dist(a)-dist(b));else if(f.best)l.sort((a,b)=>b.rating-a.rating);else if(S.preferFree)l.sort((a,b)=>free(b)-free(a));return l}
function vNear(){const l=list();return `<h1>🧭 Klo Kompass</h1><div class="mu" style="margin:-8px 0 10px">Wenn's drückt, dann drückst du.</div><button class="pri" style="background:#dc2626;font-size:17px;margin-bottom:10px" onclick="rush()">🚨 Nächstes WC jetzt</button><input id="q" placeholder="Stadt suchen, z. B. Köln" value="${esc(q)}" oninput="q=this.value;upd()">
<div class="chips"><button class="chip ${f.near?'on':''}" onclick="f.near=!f.near;f.near&&!me?locate():render()">📏 Am nächsten</button><button class="chip ${f.rad?'on':''}" onclick="f.rad=!f.rad;f.rad&&!me?locate():render()">⭕ Im Umkreis</button><button class="chip ${f.now?'on':''}" onclick="f.now=!f.now;render()">🕒 Jetzt geöffnet</button><button class="chip ${f.baby?'on':''}" onclick="f.baby=!f.baby;render()">🍼 Wickeltisch</button><button class="chip ${f.card?'on':''}" onclick="f.card=!f.card;render()">💳 Kartenzahlung</button><button class="chip ${f.best?'on':''}" onclick="f.best=!f.best;render()">⭐ Beste Bewertung</button><button class="chip ${f.free?'on':''}" onclick="f.free=!f.free;render()">Kostenlos</button><button class="chip ${f.acc?'on':''}" onclick="f.acc=!f.acc;render()">♿ Rollstuhlgerecht</button></div>
<div id="lst">${l.length?l.map(card).join(''):emptyH()}</div>`}
function upd(){const l=list();$('#lst').innerHTML=l.length?l.map(card).join(''):emptyH()}
function vMap(){const l=T.filter(t=>mapF==='Alle'||(mapF==='Kostenlos'&&free(t))||(mapF==='Kostenpflichtig'&&!free(t))||(mapF==='Barrierefrei'&&t.wheelchair));
return `<h1>Karte</h1><div class="chips">${['Alle','Kostenlos','Kostenpflichtig','Barrierefrei'].map(x=>`<button class="chip ${mapF===x?'on':''}" onclick="mapF='${x}';render()">${x}</button>`).join('')}</div>
${mapH(5.5,47.2,15.2,55.1)}<p class="mu">Karte lädt nicht? <a href="https://www.openstreetmap.org/#map=6/51.2/10.4" target="_blank" rel="noopener" style="color:var(--ac)">In OpenStreetMap öffnen</a></p>
<h2>Standorte (${l.length})</h2>${l.map(t=>`<div class="card tap" onclick="go('detail',${t.id})"><div class="row sp"><b>${esc(t.name)}</b>${badge(t.price)}</div><div class="mu">${esc(t.address)}, ${esc(t.city)}</div><div><span class="st">★</span> <b>${fmt(t.rating)}</b></div></div>`).join('')||'<p class="mu">Keine Standorte für diesen Filter.</p>'}`}
function mapH(a,b,c,d,ov){return `<div class="mapbox" id="mb"><iframe title="OpenStreetMap" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${a},${b},${c},${d}&layer=mapnik"></iframe>${ov?'<div class="ov" onclick="mapClick(event)"></div>':''}${ov&&pick?`<div class="pin" style="left:${pick.x}%;top:${pick.y}%"></div>`:''}</div>`}
const BB=[5.5,47.2,15.2,55.1],my=y=>Math.log(Math.tan(Math.PI/4+y*Math.PI/360));
function mapClick(e){const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
const lng=BB[0]+x*(BB[2]-BB[0]),mt=my(BB[3])-y*(my(BB[3])-my(BB[1])),lat=(2*Math.atan(Math.exp(mt))-Math.PI/2)*180/Math.PI;
pick={x:x*100,y:y*100};$('#lat').value=lat.toFixed(5);$('#lng').value=lng.toFixed(5);
const p=$('#mb .pin');if(p)p.remove();$('#mb').insertAdjacentHTML('beforeend',`<div class="pin" style="left:${pick.x}%;top:${pick.y}%"></div>`)}
function vAdd(){return `<h1>WC hinzufügen</h1><div class="card"><label>Bezeichnung</label><input id="n" placeholder="z. B. Stadttoilette Marktplatz">
<label>Straße &amp; Hausnummer</label><input id="a"><label>Stadt</label><input id="c">
<label>Koordinaten</label><div class="chips"><button class="chip ${cm==='manuell'?'on':''}" onclick="cm='manuell';keep()">✍️ Manuell</button><button class="chip ${cm==='karte'?'on':''}" onclick="cm='karte';keep()">🗺️ Kartenansicht</button><button class="chip" onclick="gps()">📡 GPS</button></div>
${cm==='karte'?mapH(...BB,true)+'<p class="mu">Tippe auf die Karte, um den Standort zu setzen (ungefähr).</p>':''}
<div class="row"><input id="lat" placeholder="Breite" inputmode="decimal" style="flex:1"><input id="lng" placeholder="Länge" inputmode="decimal" style="flex:1"></div>
<label>Preis</label><div>${['Kostenlos','€0,50','€1,00','€1,50','Sonstiges'].map((p,i)=>`<label class="tg" style="font-weight:400"><input type="radio" name="pr" value="${p}" ${i?'':'checked'}>${p}</label>`).join('')}</div>
<label>Öffnungszeiten</label><input id="h" placeholder="06:00–22:00">
<label class="tg"><input type="checkbox" id="w">♿ Rollstuhlgerecht</label><label class="tg"><input type="checkbox" id="wt">🍼 Wickeltisch</label><label class="tg"><input type="checkbox" id="kz">💳 Kartenzahlung</label>
<button class="pri" style="margin-top:10px" onclick="addWc()">WC-Standort veröffentlichen</button></div>`}
let draft={};
function keep(){['n','a','c','lat','lng','h'].forEach(k=>{const e=$('#'+k);if(e)draft[k]=e.value});render();for(const k in draft){const e=$('#'+k);if(e)e.value=draft[k]}}
function gps(){if(!navigator.geolocation)return toast('GPS wird nicht unterstützt.');toast('Standort wird ermittelt …');
navigator.geolocation.getCurrentPosition(p=>{$('#lat').value=p.coords.latitude.toFixed(5);$('#lng').value=p.coords.longitude.toFixed(5);toast('Standort übernommen ✓')},()=>toast('Standort konnte nicht ermittelt werden.'),{enableHighAccuracy:true,timeout:10000})}
function addWc(){const v=k=>$('#'+k).value.trim(),lat=parseFloat(v('lat').replace(',','.')),lng=parseFloat(v('lng').replace(',','.'));
if(!v('n')||!v('a')||!v('c'))return toast('Bitte Bezeichnung, Adresse und Stadt ausfüllen.');
if(isNaN(lat)||isNaN(lng)||lat<-90||lat>90||lng<-180||lng>180)return toast('Bitte gültige Koordinaten angeben.');
if(T.some(t=>(Math.abs(t.lat-lat)<.0003&&Math.abs(t.lng-lng)<.0003)||(t.name.toLowerCase()===v('n').toLowerCase()&&t.city.toLowerCase()===v('c').toLowerCase())))return toast('Dieses WC existiert bereits.');
T.push({id:Date.now(),name:v('n'),address:v('a'),city:v('c'),lat,lng,price:document.querySelector('[name=pr]:checked').value,wheelchair:$('#w').checked,baby:$('#wt').checked,card:$('#kz').checked,hours:v('h')||'Unbekannt',rating:0,review_count:0});
save();draft={};pick=null;toast('WC-Standort veröffentlicht ✓');go('near')}
function picker(){return `<div class="picker" id="pk">${[1,2,3,4,5].map(i=>`<span class="${i<=stars?'on':''}" onclick="stars=${i};document.querySelectorAll('#pk span').forEach((s,j)=>s.className=j<${i}?'on':'')">★</span>`).join('')}</div>`}
function revCard(r,showWc=true){return `<div class="card"><div class="row sp"><b>${showWc?esc(r.toilet_name):esc(r.reviewer_name)}</b><span class="mu">${esc(r.created_at)}</span></div><div class="mu">${showWc?'von '+esc(r.reviewer_name):''}</div><div class="st">${starsH(r.rating)}</div><div>${esc(r.comment)||'<span class="mu">Kein Kommentar</span>'}</div></div>`}
function vRev(){const avg=R.length?R.reduce((s,r)=>s+r.rating,0)/R.length:0,s=[...T].sort((a,b)=>b.rating-a.rating);
return `<h1>Bewertungen</h1><div class="stats"><div class="card"><div class="big">${R.length}</div><div class="mu">Bewertungen</div></div><div class="card"><div class="big">${fmt(avg)} <span class="st">★</span></div><div class="mu">Ø Bewertung</div></div></div>
<h2>Bewertung abgeben</h2><div class="card"><label>WC</label><select id="rt">${s.map(t=>`<option value="${t.id}">${esc(t.name)} (${fmt(t.rating)} ★)</option>`).join('')}</select>
<label>Dein Name / Spitzname</label><input id="rn"><label>Sterne</label>${picker()}<label>Kommentar</label><textarea id="rc" rows="3"></textarea>
<button class="pri" onclick="sendRev($('#rt').value)">Bewertung senden</button></div>
<h2>Community-Bewertungen</h2>${[...R].reverse().map(r=>revCard(r)).join('')||'<p class="mu">Noch keine Bewertungen.</p>'}`}
function sendRev(id){id=+id;const t=T.find(x=>x.id===id),n=($('#rn').value||'').trim();
if(!n)return toast('Bitte gib einen Namen ein.');if(!stars)return toast('Bitte wähle eine Sternebewertung.');
R.push({id:Date.now(),toilet_id:id,toilet_name:t.name,reviewer_name:n,rating:stars,comment:($('#rc').value||'').trim(),created_at:new Date().toISOString().slice(0,10)});
t.rating=Math.round((t.rating*t.review_count+stars)/(t.review_count+1)*10)/10;t.review_count++;save();stars=0;toast('Danke für deine Bewertung ✓');render()}
function vDetail(){const t=T.find(x=>x.id===detail);if(!t)return go('near');
const rs=R.filter(r=>r.toilet_id===t.id).reverse(),u={google:`https://www.google.com/maps/dir/?api=1&destination=${t.lat},${t.lng}`,apple:`https://maps.apple.com/?daddr=${t.lat},${t.lng}`,osm:`https://www.openstreetmap.org/directions?to=${t.lat}%2C${t.lng}`}[S.navApp];
return `<button class="back" onclick="go('near')">← Zurück</button><h1>${esc(t.name)}</h1><div class="card"><div class="row sp"><span>${esc(t.address)}, ${esc(t.city)}</span>${badge(t.price)}</div>
<div class="mu" style="margin:6px 0">🕒 ${esc(t.hours)} ${isOpen(t.hours)?'· Geöffnet':'· Geschlossen'}</div>
<div>${t.wheelchair?'<span class="badge ac">♿ Rollstuhlgerecht</span>':'<span class="badge">Nicht barrierefrei</span>'}</div>
<div style="margin:10px 0"><span class="st" style="font-size:20px">${starsH(t.rating)}</span> <b>${t.review_count?fmt(t.rating):'–'}</b> <span class="mu">(${t.review_count} Bewertungen)</span></div>
<div class="mu" style="margin-bottom:6px">${t.baby?'🍼 Wickeltisch ':''}${t.card?'💳 Kartenzahlung ':''}${me?'📏 '+dTxt(t):''}</div>${t.status?`<div class="mu">Zustand: <b>${t.status.s==='defekt'?'⚠️ Defekt':'✅ Sauber'}</b> (gemeldet am ${t.status.at})</div>`:''}<div class="row" style="margin-top:8px"><a href="${u}" target="_blank" rel="noopener"><button class="sec">🧭 Route starten</button></a><button class="sec" onclick="stat(${t.id},'sauber')">✅ Gerade sauber</button><button class="sec" onclick="stat(${t.id},'defekt')">⚠️ Defekt</button><button class="sec" onclick="rep(${t.id})">🚩 Melden</button></div></div>
<h2>Bewertung abgeben</h2><div class="card"><label>Dein Name / Spitzname</label><input id="rn"><label>Sterne</label>${picker()}<label>Kommentar</label><textarea id="rc" rows="3"></textarea><button class="pri" onclick="sendRev(${t.id})">Bewertung senden</button></div>
<h2>Bisherige Bewertungen</h2>${rs.map(r=>revCard(r,false)).join('')||'<p class="mu">Noch keine Bewertungen. Sei der Erste!</p>'}`}
function vSet(){const sw=(k,l)=>`<label class="sw" style="font-weight:400">${l}<input type="checkbox" ${S[k]?'checked':''} onchange="S.${k}=this.checked;save()"></label>`;
return `<h1>Einstellungen</h1><h2>Farbthema</h2><div class="themes">${[['hell','☀️','Hell'],['dark','🌙','Dunkel'],['herbst','🍂','Herbst'],['sommer','🌻','Sommer'],['winter','❄️','Winter']].map(([k,e,l])=>`<div class="theme ${S.theme===k?'on':''}" onclick="S.theme='${k}';save();applyTheme();render()"><b>${e}</b>${l}</div>`).join('')}</div>
<h2>Suchfilter</h2><div class="card">${sw('onlyAcc','Nur Barrierefrei')}${sw('preferFree','Kostenlos bevorzugen')}${sw('onlyOpen','Nur Geöffnete')}</div>
<h2>Navigation</h2><div class="card"><label>Navigationsapp</label><select onchange="S.navApp=this.value;save()">${[['google','Google Maps'],['apple','Apple Maps'],['osm','OpenStreetMap']].map(([k,l])=>`<option value="${k}" ${S.navApp===k?'selected':''}>${l}</option>`).join('')}</select>
<label>Suchradius</label><select onchange="S.radius=this.value;save()">${[['500','500 m'],['1000','1 km'],['2000','2 km'],['5000','5 km'],['10000','10 km']].map(([k,l])=>`<option value="${k}" ${S.radius===k?'selected':''}>${l}</option>`).join('')}</select>${sw('alerts','Community-Alerts')}</div>
<h2>Anzeige</h2><div class="card"><label>Schriftgröße</label><select onchange="S.fs=this.value;save();applyTheme()">${['normal','groß','sehr groß'].map(k=>`<option ${S.fs===k?'selected':''}>${k}</option>`).join('')}</select></div>
<h2>App-Info</h2><div class="card"><b>Klo Kompass</b> · Version 1.1<div class="mu">Wenn's drückt, dann drückst du. Die Community-App für öffentliche Toiletten in Deutschland. Kartendaten © OpenStreetMap-Mitwirkende.</div></div>
<details class="card"><summary><b>Datenschutz</b></summary><p class="mu">Dein Standort wird nur auf deinem Gerät genutzt und nicht gespeichert. Standorte und Bewertungen liegen lokal im Browser. Platzhalter: Vor dem Start durch eine rechtssichere Erklärung ersetzen.</p></details>
<details class="card"><summary><b>Impressum</b></summary><p class="mu">Klo Kompass · [Firmenname, Anschrift, Kontakt und Vertretungsberechtigte eintragen]</p></details>`}
function render(){const m={near:vNear,map:vMap,add:vAdd,rev:vRev,set:vSet,detail:vDetail};$('#app').innerHTML=m[page]();
const cur=page==='detail'?'near':page;$('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="${cur===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')}
applyTheme();render();locate(()=>{f.near=f.rad=true;render()});
</script></body></html>
